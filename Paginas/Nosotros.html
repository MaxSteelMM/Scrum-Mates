<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sobre Nosotros - ScrumMates</title>
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Nosotros.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Nuestro Equipo</h1>
            <p class="text-muted">Los apasionados detrás de ScrumMates, comprometidos con la calidad del software</p>
        </div>

        <div class="row g-4" id="team-grid">
            <!-- Cargado dinámicamente por JS -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script>
        (() => {
            const team = [
                {
                    name: 'Nicolas Burdiles',
                    role: 'Scrum Master',
                    institution: 'Epet 20',
                    motivation: 'Impulsar la agilidad para crear productos que realmente aporten valor al usuario.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Maximo Maroa',
                    role: 'Programador',
                    institution: 'Epet 20',
                    motivation: 'Construir código limpio y eficiente que sea la base de un software robusto.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Ramiro Flores',
                    role: 'Diseñador',
                    institution: 'Epet 20',
                    motivation: 'Crear experiencias de usuario intuitivas que simplifiquen la complejidad técnica.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Luca Kletzel',
                    role: 'Tester',
                    institution: 'Epet 20',
                    motivation: 'Garantizar la excelencia técnica eliminando errores antes de que lleguen al cliente.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Lionel Centurion',
                    role: 'Marketing',
                    institution: 'Epet 20',
                    motivation: 'Garantizar la excelencia técnica eliminando errores antes de que lleguen al cliente.',
                    img: 'https://via.placeholder.com/150'
                }
            ];

            const renderTeam = () => {
                const grid = document.getElementById('team-grid');
                grid.innerHTML = team.map(member => `
                    <div class="col-sm-6 col-lg-3">
                        <div class="card profile-card text-center p-4">
                            <div class="profile-img-container">
                                <img src="${member.img}" alt="${member.name}" class="profile-img">
                            </div>
                            <h5 class="fw-bold mb-1">${member.name}</h5>
                            <span class="profile-role">${member.role}</span>
                            <p class="small text-muted mb-2">${member.institution}</p>
                            <div class="profile-motivation">
                                "${member.motivation}"
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            document.addEventListener('DOMContentLoaded', renderTeam);
        })();
    </script>
</body>
</html>
