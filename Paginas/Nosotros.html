<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sobre Nosotros - ScrumMates</title>
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Nosotros.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="nav">
        <div class="logo">
            <a href="../index.html"><img src="../Img/Logo/LOGO-SCRUMATES.svg" alt="Logo" width="25%"></a>
        </div>
        <input type="checkbox" id="menu-toggle" style="display: none;">
        <label for="menu-toggle" class="hamburger"><span></span><span></span><span></span></label>
        <ul id="global-nav">
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./Calidad.html">Calidad del Software</a></li>
            <li><a href="./Herramientas_calidad.html">Herramientas de Calidad</a></li>
            <li><a href="./Ciclo_vida.html">Ciclo de vida</a></li>
            <li><a href="./Modelos_Tradicionales.html">Modelos Tradicionales</a></li>
            <li><a href="./Metodologias.html">Metodologías Ágiles</a></li>
            <li><a href="./Procesos.html">Procesos de Desarrollo</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Nuestro Equipo</h1>
            <p class="text-muted">Los apasionados detrás de ScrumMates, comprometidos con la calidad del software</p>
        </div>

        <div class="row g-4" id="team-grid">
            <!-- Cargado dinámicamente por JS -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            const team = [
                {
                    name: 'Integrante 1',
                    role: 'Scrum Master',
                    institution: 'Institución Educativa',
                    motivation: 'Impulsar la agilidad para crear productos que realmente aporten valor al usuario.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Integrante 2',
                    role: 'Programador',
                    institution: 'Institución Educativa',
                    motivation: 'Construir código limpio y eficiente que sea la base de un software robusto.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Integrante 3',
                    role: 'Diseñador',
                    institution: 'Institución Educativa',
                    motivation: 'Crear experiencias de usuario intuitivas que simplifiquen la complejidad técnica.',
                    img: 'https://via.placeholder.com/150'
                },
                {
                    name: 'Integrante 4',
                    role: 'Tester',
                    institution: 'Institución Educativa',
                    motivation: 'Garantizar la excelencia técnica eliminando errores antes de que lleguen al cliente.',
                    img: 'https://via.placeholder.com/150'
                }
            ];

            const renderTeam = () => {
                const grid = document.getElementById('team-grid');
                grid.innerHTML = team.map(member => `
                    <div class="col-sm-6 col-lg-3">
                        <div class="card profile-card text-center p-4">
                            <div class="profile-img-container">
                                <img src="${member.img}" alt="${member.name}" class="profile-img">
                            </div>
                            <h5 class="fw-bold mb-1">${member.name}</h5>
                            <span class="profile-role">${member.role}</span>
                            <p class="small text-muted mb-2">${member.institution}</p>
                            <div class="profile-motivation">
                                "${member.motivation}"
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            document.addEventListener('DOMContentLoaded', renderTeam);
        })();
    </script>
</body>
</html>
