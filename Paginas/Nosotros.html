<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sobre Nosotros - ScrumMates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Nosotros.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Nuestro Equipo</h1>
            <p class="text-muted">Los apasionados detrás de ScrumMates, comprometidos con la calidad del software</p>
        </div>

        <div class="row g-5" id="team-grid">
            <!-- Cargado dinámicamente por JS -->
        </div>
    </main>

    <footer class="mt-foot">© 2026 ScrumMates. Todos los derechos reservados.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script>
        (() => {
            const team = [
                {
                    name: 'Nicolas Burdiles',
                    role: 'Scrum Master',
                    institution: 'Epet 20',
                    motivation: 'Impulsar la agilidad para crear productos que realmente aporten valor al usuario.'
                },
                {
                    name: 'Maximo Maroa',
                    role: 'Programador',
                    institution: 'Epet 20',
                    motivation: 'Construir código limpio y eficiente que sea la base de un software robusto.'
                },
                {
                    name: 'Ramiro Flores',
                    role: 'Diseñador',
                    institution: 'Epet 20',
                    motivation: 'Crear experiencias de usuario intuitivas que simplifiquen la complejidad técnica.'
                },
                {
                    name: 'Luca Kletzel',
                    role: 'Tester',
                    institution: 'Epet 20',
                    motivation: 'Garantizar la excelencia técnica eliminando errores antes de que lleguen al cliente.'
                },
                {
                    name: 'Lionel Centurion',
                    role: 'Marketing',
                    institution: 'Epet 20',
                    motivation: 'Dar a conocer el proyecto y acercar la calidad del software a quienes más lo necesitan.'
                }
            ];

            // Avatar con iniciales (no depende de servicios externos)
            const avatar = name => {
                const ini = name.split(' ').map(w => w[0]).slice(0, 2).join('');
                const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><rect width='150' height='150' fill='#caf0f8'/><text x='50%' y='54%' font-family='Arial' font-size='56' font-weight='700' fill='#0077b6' text-anchor='middle' dominant-baseline='middle'>${ini}</text></svg>`;
                return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
            };

            const renderTeam = () => {
                const grid = document.getElementById('team-grid');
                grid.innerHTML = team.map(member => `
                    <div class="col-sm-6 col-lg-3">
                        <div class="card profile-card text-center p-4">
                            <div class="profile-img-container">
                                <img src="${member.img || avatar(member.name)}" alt="${member.name}" class="profile-img">
                            </div>
                            <h5 class="fw-bold mb-1">${member.name}</h5>
                            <span class="profile-role">${member.role}</span>
                            <p class="small text-muted mb-2">${member.institution}</p>
                            <div class="profile-motivation">
                                "${member.motivation}"
                            </div>
                        </div>
                    </div>
                `).join('');
            };

            document.addEventListener('DOMContentLoaded', renderTeam);
        })();
    </script>
</body>
</html>
