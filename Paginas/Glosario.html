<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glosario de Calidad de Software</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Glosario.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5 glossary-container">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Glosario Técnico</h1>
            <p class="text-muted">Términos fundamentales de calidad y desarrollo de software</p>
        </div>

        <div class="search-wrapper">
            <i class="bi bi-search"></i>
            <input type="text" id="glossary-search" aria-label="Buscar en el glosario" class="form-control form-control-lg" placeholder="Buscar término o definición...">
        </div>

        <div class="alphabet-index" id="alphabet-index">
            <!-- Generado dinámicamente por JS -->
        </div>

        <div class="row g-4" id="terms-grid">
            <!-- Generado dinámicamente por JS -->
        </div>
    </main>

    <footer class="mt-foot">© 2026 ScrumMates. Todos los derechos reservados.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script src="../JS/Glosario.js" defer></script>
</body>

</html>
