<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - ScrumMates</title>
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Contacto.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Contáctanos</h1>
            <p class="text-muted">Estamos aquí para resolver tus dudas sobre agilidad y calidad</p>
        </div>

        <div class="contact-container">
            <div class="contact-card" id="form-container">
                <form id="contact-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="name">Nombre completo</label>
                        <input type="text" id="name" class="form-control-custom" placeholder="Ej. Juan Pérez" required>
                        <span class="error-message" id="error-name">El nombre es obligatorio.</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input type="email" id="email" class="form-control-custom" placeholder="juan@ejemplo.com" required>
                        <span class="error-message" id="error-email">Por favor, ingresa un correo válido.</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="subject">Asunto</label>
                        <input type="text" id="subject" class="form-control-custom" placeholder="¿En qué podemos ayudarte?" required>
                        <span class="error-message" id="error-subject">El asunto es obligatorio.</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="message">Mensaje</label>
                        <textarea id="message" class="form-control-custom" rows="5" placeholder="Escribe tu consulta aquí..." required></textarea>
                        <span class="error-message" id="error-message">El mensaje no puede estar vacío.</span>
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">
                        Enviar Mensaje <i class="bi bi-send-fill ms-2"></i>
                    </button>
                </form>

                <div class="confirmation-message" id="confirmation">
                    <i class="bi bi-check-circle-fill"></i>
                    <h2 class="fw-bold">¡Mensaje Enviado!</h2>
                    <p class="text-muted">Hemos recibido tu mensaje correctamente. Te responderemos lo antes posible.</p>
                    <button class="btn btn-outline-primary mt-3" onclick="location.reload()">Enviar otro mensaje</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script src="../JS/Formularios.js"></script>
</body>
</html>
