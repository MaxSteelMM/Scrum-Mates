<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enlaces de Interés - ScrumMates</title>
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Recursos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="nav">
        <div class="logo">
            <a href="../index.html"><img src="../Img/Logo/LOGO-SCRUMATES.svg" alt="Logo" width="25%"></a>
        </div>
        <input type="checkbox" id="menu-toggle" style="display: none;">
        <label for="menu-toggle" class="hamburger"><span></span><span></span><span></span></label>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./Calidad.html">Calidad del Software</a></li>
            <li><a href="./Herramientas_calidad.html">Herramientas de Calidad</a></li>
            <li><a href="./Ciclo_vida.html">Ciclo de vida</a></li>
            <li><a href="./Modelos_Tradicionales.html">Modelos Tradicionales</a></li>
            <li><a href="./Metodologias.html">Metodologías Ágiles</a></li>
            <li><a href="./Procesos.html">Procesos de Desarrollo</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Recursos y Enlaces de Interés</h1>
            <p class="text-muted">Explora fuentes oficiales y material complementario sobre calidad y agilidad</p>
        </div>

        <div class="resources-grid" id="resources-grid">
            <!-- Cargado dinámicamente por JS -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (() => {
            const resources = [
                {
                    title: 'Scrum Guide',
                    desc: 'La guía oficial de Scrum creada por Ken Schwaber y Jeff Sutherland.',
                    url: 'https://scrumguides.org/',
                    type: 'web',
                    icon: 'bi-book'
                },
                {
                    title: 'Kanban University',
                    desc: 'Recursos oficiales y certificaciones sobre el método Kanban.',
                    url: 'https://kanban.university/',
                    type: 'web',
                    icon: 'bi-columns-gap'
                },
                {
                    title: 'ISO/IEC 25010',
                    desc: 'Estándar internacional para la calidad del producto de software.',
                    url: 'https://www.iso.org/standard/35721.html',
                    type: 'pdf',
                    icon: 'bi-file-earmark-pdf'
                },
                {
                    title: 'ISTQB',
                    desc: 'Board internacional de certificación para profesionales de testing.',
                    url: 'https://www.istqb.org/',
                    type: 'org',
                    icon: 'bi-building'
                },
                {
                    title: 'Martin Fowler',
                    desc: 'Blog referente sobre arquitectura de software, refactorización y agilidad.',
                    url: 'https://martinfowler.com/',
                    type: 'web',
                    icon: 'bi-person-workspace'
                },
                {
                    title: 'Agile Alliance',
                    desc: 'Organización global dedicada a la promoción de los valores ágiles.',
                    url: 'https://www.agilealliance.org/',
                    type: 'org',
                    icon: 'bi-globe'
                }
            ];

            const renderResources = () => {
                const grid = document.getElementById('resources-grid');
                grid.innerHTML = resources.map(res => `
                    <div class="card resource-card p-4">
                        <div class="resource-icon">
                            <i class="bi ${res.icon}"></i>
                        </div>
                        <span class="resource-type">${res.type === 'web' ? 'Sitio Web' : res.type === 'pdf' ? 'Documento PDF' : 'Organización'}</span>
                        <h5 class="fw-bold">${res.title}</h5>
                        <p class="text-muted flex-grow-1">${res.desc}</p>
                        <a href="${res.url}" target="_blank" rel="noopener noreferrer" class="btn btn-resource mt-3">
                            Visitar recurso <i class="bi bi-arrow-up-right-circle ms-2"></i>
                        </a>
                    </div>
                `).join('');
            };

            document.addEventListener('DOMContentLoaded', renderResources);
        })();
    </script>
</body>
</html>
