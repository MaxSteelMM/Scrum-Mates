<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparador de Metodologías - ScrumMates</title>
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Comparador.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5 comparator-container">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Comparador de Metodologías</h1>
            <p class="text-muted">Selecciona los marcos de trabajo que deseas comparar para analizar sus diferencias clave</p>
        </div>

        <div class="selection-panel">
            <h5 class="fw-bold mb-3">Selecciona Metodologías:</h5>
            <div class="method-checkbox-group" id="method-selectors">
                <!-- Generado dinámicamente por JS -->
            </div>
        </div>

        <div id="table-container" class="comparison-table-wrapper">
            <!-- Tabla generada dinámicamente -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script src="../JS/Comparador.js"></script>
</body>
</html>
