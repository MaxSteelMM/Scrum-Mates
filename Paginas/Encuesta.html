<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encuesta de Metodologías - ScrumMates</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Estilos/Style.css">
    <link rel="stylesheet" href="../Estilos/Navbar.css">
    <link rel="stylesheet" href="../Estilos/Encuesta.css">
</head>

<body>
    <div id="site-nav"></div>

    <main class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Asistente de Metodología</h1>
            <p class="text-muted">Responde unas breves preguntas y descubriremos cuál es el enfoque ideal para tu proyecto</p>
        </div>

        <div class="wizard-container" id="wizard">
            <div class="progress-wrapper">
                <div class="d-flex justify-content-between mb-2">
                    <span class="small fw-bold text-muted" id="step-counter">Paso 1 de 5</span>
                    <span class="small fw-bold text-primary" id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-custom">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div id="steps-container">
                <!-- Pasos generados dinámicamente por JS -->
            </div>
            <p id="step-error" class="text-danger small text-center mt-3 mb-0" role="alert"></p>

            <div class="d-flex justify-content-between mt-4" id="wizard-nav">
                <button id="prev-btn" class="btn btn-outline-secondary px-4" disabled>Anterior</button>
                <button id="next-btn" class="btn btn-primary px-4">Siguiente</button>
            </div>
        </div>
    </main>

    <footer class="mt-foot">© 2026 ScrumMates. Todos los derechos reservados.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/navbar.js" defer></script>
    <script src="../JS/Encuesta.js" defer></script>
</body>
</html>
